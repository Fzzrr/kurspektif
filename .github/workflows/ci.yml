# Cek otomatis setiap push dan pull request: lint, tipe, test, dan build.
# Build tidak butuh database sungguhan (halaman yang membaca DB dirender saat
# request), jadi variabel lingkungan di bawah cukup nilai pengganti.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cek:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci # postinstall menjalankan prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
